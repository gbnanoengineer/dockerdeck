<style>
  :root {

    --bg: #f2f5fb; --panel: #ffffff; --panel2: #f6f8fd; --line: #e1e6f0; --text: #16202f; --muted: #627089;
    --accent: #2f6bff; --accent2: #7c5cf0; --ok: #12a66a; --warn: #d9820f; --bad: #e0414f; --shadow: 0 6px 24px rgba(30,50,90,.08);
    color-scheme: light;
  }

  html, body { margin: 0; height: 100%; }
  body {

  .logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; font-weight: 700; font-size: 16px; letter-spacing: .2px; }
  .logo i { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); background: none; border: 0; cursor: pointer; text-align: left; width: 100%; }
  .nav:hover { background: var(--panel2); color: var(--text); }
  .nav.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-weight: 600; }
  .nav .n { margin-left: auto; font-size: 12px; background: var(--panel2); padding: 0 7px; border-radius: 10px; color: var(--muted); }

  section.page { padding: 20px 24px 40px; max-width: 1280px; width: 100%; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .top h1 { font-size: 20px; margin: 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }
  .live.off { background: var(--bad); animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
  .card > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }

  .pad { padding: 14px 16px; }

  .ring .fg { transition: stroke-dashoffset .6s ease; }

  .gauge small, .muted { color: var(--muted); }

  .badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--panel2); color: var(--muted); }
  .badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); } .badge.warn { color: var(--warn); }
  .spark { width: 60px; height: 20px; display: block; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(5, 8, 14, .6); backdrop-filter: blur(2px); }
  dialog.wide { width: min(1000px, 95vw); }
  dialog.pal { width: min(560px, 94vw); margin-top: 12vh; }
  .dhead { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .logs { margin: 0; height: 62vh; overflow: auto; font: 12px/1.45 ui-monospace, "JetBrains Mono", monospace; padding: 8px 0; background: color-mix(in srgb, var(--bg) 70%, #000); }
  .logs div { padding: 0 14px; white-space: pre-wrap; word-break: break-all; }
  .logs div:hover { background: var(--panel2); }
  .logs .ts { color: var(--muted); margin-right: 10px; }
  .logs .err { color: var(--bad); } .logs .wrn { color: var(--warn); }
  .logs.nowrap div { white-space: pre; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; padding: 12px 16px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; }
  .tabs { display: flex; gap: 4px; padding: 8px 14px 0; border-bottom: 1px solid var(--line); }
  .tabs button { background: none; border: 0; padding: 8px 12px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--accent); border-color: var(--accent); }
  .scroll { max-height: 62vh; overflow: auto; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  .plist { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }

  .plist li.sel { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .plist li small { margin-left: auto; color: var(--muted); }
  .pin { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 16px; background: transparent; }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
  .toast { background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 10px; max-width: 420px; box-shadow: var(--shadow); }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-size: 11px; }
  .app { grid-template-columns: 220px minmax(0, 1fr); }
  .banner { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .banner b { font-size: 16px; }
  .banner.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); } .banner.warn { background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .banner.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); }

  .cmd code { font: 12px ui-monospace, monospace; overflow: auto; white-space: pre; }
  pre.ev { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow: auto; }
  pre.out { margin: 8px 0 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow: auto; }
  .sect { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .sect h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .tl { display: grid; grid-template-columns: 90px 140px 1fr; gap: 4px 10px; font-size: 13px; }
  .shell { display: flex; gap: 8px; margin-top: 8px; }
  .shell input { flex: 1; font-family: ui-monospace, monospace; }
  .nav .n.bad { background: var(--bad); color: #fff; }
  .prow { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .prow:last-child { border: 0; } .prow .why { flex: 1; min-width: 0; }
  .code { font: 12px/1.5 ui-monospace, "JetBrains Mono", monospace; padding: 8px 0; max-height: 62vh; overflow: auto; background: color-mix(in srgb, var(--bg) 70%, #000); }
  .code .cl { display: flex; padding: 0 14px 0 0; white-space: pre; } .code .cl:hover { background: var(--panel2); }

  .svc:last-child { border: 0; }
  .cname { display: flex; align-items: center; gap: 8px; }

    section.page { padding: 14px 12px 40px; }

    .row .name { width: 45%; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>

<body>
<div class="app">
  <aside>
    <div class="logo"><i id="logoi"></i> DockerDeck</div>
    <div id="nav"></div>
    <div class="grow"></div>
    <div class="side-foot">
      <select id="ctx" title="Docker context"></select>
      <div class="tools" id="tools"></div>
    </div>
  </aside>
  <section class="page">
    <div class="top">
      <h1 id="title">Overview</h1>
      <span class="pill"><span class="live" id="live"></span><span id="livet">connecting</span></span>
      <span class="pill" id="hostpill" style="display:none"></span>
      <span class="sp"></span>
      <button class="btn" id="palbtn">Search <kbd>Ctrl K</kbd></button>
    </div>
    <div id="view"></div>
  </section>
</div>
<dialog id="dlg" class="wide"></dialog>
<dialog id="pal" class="pal"></dialog>
<div id="toasts"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);

  containers: 'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',

  cleanup: 'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6',

function icon(name) {

  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');

  return b;
}

}

// ---------- problems ----------

function problemsOf() {
  const out = [];
  for (const c of S.containers) {
    const code = (/Exited \((\d+)\)/.exec(c.status) || [])[1];
    const s = S.stats[c.id];
    let sev = null, why = '';
    if (c.state === 'restarting') { sev = 'bad'; why = 'Restarting in a loop'; }
    else if (c.health === 'unhealthy') { sev = 'bad'; why = 'Health check is failing'; }
    else if (c.state === 'dead') { sev = 'bad'; why = 'Container is dead'; }
    else if (c.state === 'exited' && code && code !== '0' && code !== '143') { sev = 'bad'; why = code === '137' ? 'Killed (exit 137). Often out of memory.' : `Stopped with an error (exit ${code})`; }
    else if (s && s.limit && s.mem / s.limit > 0.9) { sev = 'warn'; why = 'Close to its memory limit'; }
    else if (c.state === 'paused') { sev = 'warn'; why = 'Paused'; }
    if (sev) out.push({ c, sev, why });
  }
  return out.sort((a, b) => (a.sev === 'bad' ? 0 : 1) - (b.sev === 'bad' ? 0 : 1));
}
function problemRow(p) {
  const c = p.c;
  return h('div', { class: 'prow' }, h('span', { class: 'dot ' + p.sev }),
    h('div', { class: 'why' }, h('b', {}, c.name), h('div', { class: 'muted' }, p.why)),
    h('button', { class: 'btn primary', onclick: () => openDiagnose(c) }, 'Debug'),
    ib('logs', 'Logs', () => openLogs(c)),
    c.state === 'running' ? ib('restart', 'Restart', () => act(c, 'restart')) : ib('play', 'Start', () => act(c, 'start')));
}

const deep = { running: false, done: 0, total: 0, rows: null };
async function deepScan() {
  const list = S.containers.filter((c) => c.state === 'running');
  Object.assign(deep, { running: true, done: 0, total: list.length, rows: [] });
  drawProblems();
  let i = 0;
  const worker = async () => {
    while (i < list.length) {
      const c = list[i++];
      try {
        const d = await api(`/api/diagnose/${c.id}?${Q()}`);
        const fs = d.findings.filter((f) => f.sev === 'bad' || f.sev === 'warn');
        if (fs.length) deep.rows.push({ c, fs });
      } catch { /* skip */ }
      deep.done++;
      if (S.tab === 'problems' && !document.querySelector('dialog[open]')) drawProblems();
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  deep.running = false; if (S.tab === 'problems') drawProblems();
}

// ---------- logs ----------

function openLogs(c) {
  const dlg = $('#dlg'); dlg.className = 'wide';
  const MAX = 3000;
  let lines = [], es = null, filter = '', follow = true;
  const pre = h('div', { class: 'logs' });
  const lineEl = (raw) => {
    const sp = raw.indexOf(' ');
    const ts = sp > 20 ? raw.slice(11, 19) : '', msg = sp > 20 ? raw.slice(sp + 1) : raw;
    const cls = /\b(error|fatal|panic|exception|traceback|critical)\b/i.test(msg) ? 'err' : /\bwarn(ing)?\b/i.test(msg) ? 'wrn' : '';
    return h('div', { class: cls }, h('span', { class: 'ts' }, ts), msg);
  };
  const match = (l) => !filter || l.toLowerCase().includes(filter);
  const rebuild = () => { pre.replaceChildren(...lines.filter(match).map(lineEl)); pre.scrollTop = pre.scrollHeight; };
  const add = (batch) => {
    const stick = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 60;
    lines.push(...batch);
    if (lines.length > MAX) lines = lines.slice(-MAX);
    for (const l of batch) if (match(l)) pre.append(lineEl(l));
    while (pre.childElementCount > MAX) pre.firstChild.remove();
    if (stick) pre.scrollTop = pre.scrollHeight;
  };
  const stop = () => { if (es) { es.close(); es = null; } };
  const start = (tail) => {
    stop(); es = new EventSource(`/api/logs/${c.id}/stream?${Q()}&tail=${tail}`);
    es.onmessage = (e) => add(JSON.parse(e.data));
    es.onerror = () => { stop(); follow = false; pb.classList.remove('on'); };
  };
  const pb = ib('pause', 'Live follow on/off', () => { follow = !follow; pb.classList.toggle('on', follow); follow ? start(0) : stop(); }, 'on');
  dlg.replaceChildren(
    h('div', { class: 'dhead' }, h('b', {}, c.name), h('span', { class: 'sp' }),
      h('input', { class: 'field', placeholder: 'Filter lines', oninput: (e) => { filter = e.target.value.toLowerCase(); rebuild(); } }),
      pb,
      ib('wrap', 'Wrap lines', () => pre.classList.toggle('nowrap')),
      ib('download', 'Download', () => {
        const a = h('a', { href: URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/plain' })), download: `${c.name}.log` }); a.click(); URL.revokeObjectURL(a.href);
      }),
      ib('cleanup', 'Clear view', () => { lines = []; pre.replaceChildren(); }),
      ib('x', 'Close', () => dlg.close())),
    pre);
  dlg.onclose = () => { stop(); dlg.onclose = null; draw(); };
  dlg.showModal(); start(300);
}

  dlg.showModal();
  let d;
  try { d = await api(`/api/inspect/${c.id}?${Q()}`); } catch (e) { body.replaceChildren(h('div', { class: 'empty' }, e.message)); return; }
  const kv = (rows) => h('dl', { class: 'kv' }, rows.filter((r) => r[1] != null && r[1] !== '').flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]));
  const secret = (e) => {
    if (!e.secret) return e.value;
    const s = h('span', { class: 'mono', style: 'cursor:pointer', title: 'Click to reveal' }, '••••••••');
    s.onclick = () => { s.textContent = e.value; s.onclick = null; };
    return s;
  };
  const panes = {
    Overview: () => kv([['Image', d.image], ['State', `${d.state}${d.exit_code ? ' (exit ' + d.exit_code + ')' : ''}${d.oom_killed ? ' · killed for memory' : ''}`],
      ['Health', d.health], ['Started', d.started], ['Restarts', String(d.restarts)], ['Restart policy', d.restart_policy],
      ['Memory limit', d.mem_limit ? bytes(d.mem_limit) : 'none'], ['Command', (d.cmd || []).join(' ')], ['Entrypoint', (d.entrypoint || []).join(' ')],
      ['Working dir', d.workdir], ['User', d.user], ['Ports', d.ports.join(', ')]]),
    Environment: () => kv(d.env.map((e) => [e.key, secret(e)])),
    Mounts: () => kv(d.mounts.map((m) => [`${m.type}${m.rw ? '' : ' (ro)'}`, `${m.src}  →  ${m.dst}`])),
    Network: () => kv(d.networks.map((n) => [n.name, n.ip])),
    Labels: () => kv(Object.entries(d.labels)),
  };
  const show = (name) => {
    tabs.replaceChildren(...Object.keys(panes).map((k) => h('button', { class: k === name ? 'on' : '', onclick: () => show(k) }, k)));
    body.replaceChildren(panes[name]());
  };
  show('Overview');
}

// ---------- palette (Ctrl+K) ----------

function openPalette() {
  const dlg = $('#pal');
  let sel = 0, items = [];
  const input = h('input', { class: 'field pin', placeholder: 'Jump to a page, container or context...' });
  const ul = h('ul', { class: 'plist' });
  const all = () => [
    ...TABS.map(([id, l]) => ({ label: l, hint: 'page', run: () => go(id) })),
    ...S.containers.map((c) => ({ label: c.name, hint: c.state === 'running' ? 'logs' : c.state, run: () => openLogs(c) })),
    ...S.containers.map((c) => ({ label: `Debug ${c.name}`, hint: 'diagnose', run: () => openDiagnose(c) })),
    ...S.contexts.filter((c) => c.reachable).map((c) => ({ label: `Context: ${c.name}`, hint: 'switch', run: () => switchCtx(c.name) })),
    { label: 'Toggle theme', hint: 'action', run: () => $('#tools button').click() },
  ];
  const fill = () => {
    const q = input.value.toLowerCase();
    items = all().filter((i) => i.label.toLowerCase().includes(q)).slice(0, 12);
    sel = Math.min(sel, Math.max(items.length - 1, 0));
    ul.replaceChildren(...items.map((it, i) => h('li', { class: i === sel ? 'sel' : '', onclick: () => pick(i) }, it.label, h('small', {}, it.hint))));
  };
  const pick = (i) => { const it = items[i]; dlg.close(); if (it) setTimeout(it.run, 0); };
  input.oninput = () => { sel = 0; fill(); };
  input.onkeydown = (e) => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, items.length - 1); fill(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); fill(); e.preventDefault(); }
    else if (e.key === 'Enter') pick(sel);
  };
  dlg.replaceChildren(input, ul); fill();
  if (!dlg.open) dlg.showModal();
  input.focus();
}

// ---------- start ----------

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing && !document.querySelector('dialog[open]')) { e.preventDefault(); if (S.tab !== 'containers') go('containers'); setTimeout(() => $('#cfilter') && $('#cfilter').focus(), 30); }
});
$('#palbtn').onclick = openPalette;
document.addEventListener('pointerdown', () => { S.pressed = true; }, true);
for (const ev of ['pointerup', 'pointercancel']) document.addEventListener(ev, () => {
  setTimeout(() => { S.pressed = false; if (S.pending) { S.pending = false; draw(); } }, 200);
}, true);
$('#logoi').innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h3v3H5zm4 0h3v3H9zm4 0h3v3h-3zM9 8h3v3H9zm4 0h3v3h-3z" fill="#fff"/></svg>';

function applyHash() {
  const [kind, name] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (TABS.some((t) => t[0] === kind)) go(kind);
  if (kind === 'debug' && name) { const c = S.containers.find((x) => x.name === name); if (c) openDiagnose(c); }
}
addEventListener('hashchange', applyHash);

(async () => {
  const saved = store.get('theme');
  if (saved) document.documentElement.dataset.theme = saved;
  else if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
  drawNav(); drawTools();
  try { await loadContexts(); } catch (e) { toast(e.message); }
  await refresh(true);
  applyHash();
  // Poll only while the tab is visible. Hidden tab = no load on the server.
  setInterval(() => { if (!document.hidden && !document.querySelector('dialog[open]')) refresh(false); }, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
})();
</script>
